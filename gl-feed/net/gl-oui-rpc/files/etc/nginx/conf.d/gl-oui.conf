# GL SDK4 GUI - reimplemented backend.
#
# Serves GL's vendored frontend bundle (package gl-oui-www) and the /rpc
# JSON-RPC endpoint (package gl-oui-rpc), on :80/:443; stock uhttpd/LuCI
# is moved to :8080/:8443 by /etc/uci-defaults/91-gl-oui-demote-uhttpd
# (installed by this package) so it remains available as a fallback admin
# UI.
#
# nginx-mod-lua-resty-core/nginx-mod-lua-resty-lrucache install their
# .lua files to /usr/lib/lua/resty/, but that directory isn't part of
# nginx-mod-lua's compiled-in default lua_package_path (only the .so
# cpath default covers /usr/lib/lua), so resty.core can't load without
# this. The trailing `;;` still appends the compiled-in default after it.
lua_package_path "/usr/share/gl-oui/?.lua;/usr/lib/lua/?.lua;;";

server {
	# Generated by local-access.set_config. Keeping listeners in a separate
	# include lets the unchanged GL Management Control page change HTTP/
	# HTTPS ports atomically without rewriting this package-owned server.
	include /etc/gl-oui-listen.conf;

	# Populated by the "local-access" RPC object; empty = unrestricted
	# (default). Lives under /etc (persisted in the overlay, not
	# /var/tmpfs) with an empty file shipped by this package, so nginx's
	# `include` never hits a missing-file error at boot.
	include /etc/gl-oui-access.conf;

	root /www;
	index gl_home.html restore-ui.html;

	gzip_static on;

	location = /rpc {
		default_type application/json;
		content_by_lua_file /usr/share/gl-oui/oui-rpc.lua;
	}

	location = /download {
		content_by_lua_file /usr/share/gl-oui/oui-download.lua;
	}

	location = /ws {
		# recv_frame() intentionally uses a short cosocket timeout as its
		# subscription polling clock.  OpenResty's default socket-error
		# logging otherwise emits a scary nginx error every two seconds for
		# every healthy dashboard tab even though oui-ws handles that timeout.
		lua_socket_log_errors off;
		content_by_lua_file /usr/share/gl-oui/oui-ws.lua;
	}

	# The unchanged GL AdGuard page reads the upstream AdGuard API from
	# same-origin /control/*.  Keep it behind the GL session gate and proxy
	# only that API prefix; AdGuard's advanced UI remains on LAN port 3000.
	location /control/ {
		access_by_lua_file /usr/share/gl-oui/oui-access.lua;
		proxy_pass http://127.0.0.1:3000;
	}

	location ~ ^/(js|theme|fonts|i18n|views|images)/ {
		access_by_lua_file /usr/share/gl-oui/oui-access.lua;
	}

	location / {
		try_files $uri $uri/ /gl_home.html /restore-ui.html;
	}

	# Lets a freshly-flashed router accept the GL UI backup tarball (see
	# gl-oui-runtime's oui-restore.lua) before the GL GUI files exist at
	# all - restore-ui.html above only ever renders as a fallback until
	# that upload happens.
	location = /restore-ui {
		client_max_body_size 20m;
		content_by_lua_file /usr/share/gl-oui/oui-restore.lua;
	}
}
